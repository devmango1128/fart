<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>똥 피하기 - FART LAB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            height: 100vh;
            background: linear-gradient(135deg, #3e2314 0%, #5c3317 50%, #4a2a12 100%);
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            touch-action: none;
        }

        .game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .game-container.shake {
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-6px, 3px); }
            40% { transform: translate(6px, -3px); }
            60% { transform: translate(-4px, 2px); }
            80% { transform: translate(4px, -2px); }
        }

        /* HUD */
        .hud {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 16px;
            pointer-events: none;
        }

        .hud > * {
            pointer-events: auto;
        }

        .hud-left {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .hud-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 162, 78, 0.2);
            border-radius: 10px;
            padding: 6px 14px;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
            font-family: inherit;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        #lives {
            font-size: 20px;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));
            letter-spacing: 2px;
        }

        .hud-badge {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 162, 78, 0.3);
            border-radius: 10px;
            padding: 6px 14px;
            color: #f5d89a;
            font-size: 14px;
            font-weight: 900;
            font-family: inherit;
            white-space: nowrap;
        }

        #level {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        #bestScore {
            font-size: 11px;
            color: rgba(212, 162, 78, 0.6);
        }

        /* Combo */
        #combo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            font-weight: 900;
            color: #f5d89a;
            text-shadow: 0 2px 10px rgba(212, 162, 78, 0.6);
            opacity: 0;
            z-index: 90;
            pointer-events: none;
            transition: none;
        }

        #combo.show {
            animation: comboPopup 0.8s ease-out forwards;
        }

        @keyframes comboPopup {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
            30% { opacity: 1; transform: translate(-50%, -50%) scale(1.3); }
            100% { opacity: 0; transform: translate(-50%, -80%) scale(1); }
        }

        /* Character Select */
        .char-select {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
        }

        .char-option {
            width: 60px;
            height: 60px;
            font-size: 36px;
            line-height: 60px;
            text-align: center;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .char-option:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-3px);
        }

        .char-option.selected {
            border-color: #d4a24e;
            background: rgba(212, 162, 78, 0.2);
            box-shadow: 0 0 15px rgba(212, 162, 78, 0.3);
        }

        .char-label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 10px;
        }

        /* Player */
        #player {
            position: absolute;
            bottom: 40px;
            width: 30px;
            height: 30px;
            font-size: 22px;
            line-height: 30px;
            text-align: center;
            transition: left 0.08s ease-out;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
            z-index: 10;
        }

        #player.hit {
            animation: playerHit 0.5s ease;
        }

        @keyframes playerHit {
            0%, 100% { filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3)); }
            25% { filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3)) brightness(3); }
            50% { filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3)) brightness(1); }
            75% { filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3)) brightness(3); }
        }

        #player.shield {
            box-shadow: 0 0 20px 8px rgba(100, 200, 255, 0.4);
            border-radius: 50%;
        }

        /* Poop */
        .poop {
            position: absolute;
            width: 25px;
            height: 25px;
            font-size: 20px;
            line-height: 25px;
            text-align: center;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
            animation: poopSpin 2s linear infinite;
        }

        .poop.big {
            width: 35px;
            height: 35px;
            font-size: 28px;
            line-height: 35px;
        }

        @keyframes poopSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Items */
        .item {
            position: absolute;
            width: 25px;
            height: 25px;
            font-size: 20px;
            line-height: 25px;
            text-align: center;
            filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.6));
            animation: itemGlow 1s ease-in-out infinite alternate;
            z-index: 5;
        }

        @keyframes itemGlow {
            0% { filter: drop-shadow(0 0 4px rgba(255, 215, 0, 0.3)); transform: scale(1); }
            100% { filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.8)); transform: scale(1.1); }
        }

        /* Float score text */
        .float-score {
            position: absolute;
            font-size: 18px;
            font-weight: 900;
            color: #f5d89a;
            pointer-events: none;
            z-index: 80;
            animation: floatUp 0.8s ease-out forwards;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.3); }
        }

        /* Hit flash */
        .hit-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 50, 50, 0.2);
            z-index: 95;
            pointer-events: none;
            animation: flashOut 0.3s ease-out forwards;
        }

        @keyframes flashOut {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(62, 35, 20, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            color: #fff;
            text-align: center;
            padding: 20px;
        }

        .overlay.hidden {
            display: none;
        }

        .overlay-icon {
            font-size: 72px;
            margin-bottom: 16px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .overlay h2 {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .overlay p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 32px;
            line-height: 1.8;
        }

        .overlay-btn {
            padding: 14px 48px;
            background: linear-gradient(135deg, #8b5a2b 0%, #d4a24e 100%);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            letter-spacing: 1px;
        }

        .overlay-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(139, 90, 43, 0.4);
        }

        .overlay-btn:active {
            transform: scale(0.97);
        }

        .final-score {
            font-size: 64px;
            font-weight: 900;
            background: linear-gradient(90deg, #d4a24e, #f5d89a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 8px 0 4px;
        }

        .final-score-label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .final-best {
            font-size: 13px;
            color: rgba(212, 162, 78, 0.6);
            margin-bottom: 24px;
        }

        .final-best.new-record {
            color: #f5d89a;
            font-weight: 700;
        }

        /* Touch zones */
        .touch-zone {
            position: absolute;
            bottom: 0;
            width: 50%;
            height: 100%;
            z-index: 50;
            opacity: 0;
        }

        .touch-zone-left { left: 0; }
        .touch-zone-right { right: 0; }

        .control-hint {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: rgba(255, 255, 255, 0.25);
            z-index: 100;
            white-space: nowrap;
        }

        /* Ground line */
        .ground {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(212, 162, 78, 0.15), transparent);
        }
    </style>
</head>
<body>
    <!-- Start Screen -->
    <div class="overlay" id="startScreen">
        <div class="overlay-icon">💩</div>
        <h2>똥 피하기</h2>
        <p>
            하늘에서 쏟아지는 똥을 피하세요!<br>
            ⭐ 별을 먹으면 보너스 점수<br>
            🛡️ 방패를 먹으면 1회 보호
        </p>
        <div class="char-label">캐릭터 선택</div>
        <div class="char-select">
            <div class="char-option selected" data-char="🏃">🏃</div>
            <div class="char-option" data-char="🐶">🐶</div>
            <div class="char-option" data-char="🐱">🐱</div>
            <div class="char-option" data-char="🐸">🐸</div>
        </div>
        <button class="overlay-btn" id="startBtn">START</button>
    </div>

    <!-- Game Over Screen -->
    <div class="overlay hidden" id="gameOverScreen">
        <div class="overlay-icon">💀</div>
        <h2>Game Over</h2>
        <div class="final-score" id="finalScore">0</div>
        <div class="final-score-label">score</div>
        <div class="final-best" id="finalBest"></div>
        <button class="overlay-btn" id="restartBtn">다시 하기</button>
    </div>

    <!-- Game -->
    <div class="game-container" id="gameContainer">
        <div class="hud">
            <div class="hud-left">
                <a href="index.html" class="back-btn">← 돌아가기</a>
                <div id="lives">❤️❤️❤️</div>
            </div>
            <div class="hud-right">
                <div class="hud-badge" id="score">0</div>
                <div id="level">Lv.1</div>
                <div id="bestScore"></div>
            </div>
        </div>
        <div id="combo"></div>
        <div id="player"></div>
        <div class="ground"></div>
        <div class="touch-zone touch-zone-left" id="touchLeft"></div>
        <div class="touch-zone touch-zone-right" id="touchRight"></div>
        <div class="control-hint">← 터치 또는 방향키로 이동 →</div>
    </div>

    <script src="src/js/game.js"></script>
</body>
</html>
