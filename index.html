<!DOCTYPE html>
<html lang="ko">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta content='width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no' name='viewport'>
    <meta http-equiv="Cache-Control" content="no-cache">
    <meta charset="utf-8">
    <title>FART LAB</title>
    <link href="src/css/index.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="app-header">
            <div class="header-icon"><i class="fa-solid fa-wind"></i></div>
            <h1>FART LAB</h1>
            <p class="header-subtitle">만우절 에디션</p>
        </header>

        <!-- Tab Navigation -->
        <nav class="tab-nav">
            <button class="tab-btn active" data-tab="soundboard">
                <span class="tab-icon"><i class="fa-solid fa-volume-high"></i></span>
                <span class="tab-label">사운드</span>
            </button>
            <button class="tab-btn" data-tab="health">
                <span class="tab-icon"><i class="fa-solid fa-wave-square"></i></span>
                <span class="tab-label">방귀체크</span>
            </button>
            <button class="tab-btn" data-tab="game">
                <span class="tab-icon"><i class="fa-solid fa-gamepad"></i></span>
                <span class="tab-label">게임</span>
            </button>
        </nav>

        <!-- Soundboard Tab -->
        <section class="tab-content active" id="tab-soundboard">
            <div class="sound-grid">
                <button class="sound-card" onclick="soundPlay(1)" data-sound="1">
                    <div class="sound-emoji"><i class="fa-solid fa-droplet"></i></div>
                    <div class="sound-name">사운드 1</div>
                    <div class="sound-wave">
                        <span></span><span></span><span></span><span></span><span></span>
                    </div>
                </button>
                <button class="sound-card" onclick="soundPlay(2)" data-sound="2">
                    <div class="sound-emoji"><i class="fa-solid fa-cloud"></i></div>
                    <div class="sound-name">사운드 2</div>
                    <div class="sound-wave">
                        <span></span><span></span><span></span><span></span><span></span>
                    </div>
                </button>
                <button class="sound-card" onclick="soundPlay(3)" data-sound="3">
                    <div class="sound-emoji"><i class="fa-solid fa-bolt"></i></div>
                    <div class="sound-name">사운드 3</div>
                    <div class="sound-wave">
                        <span></span><span></span><span></span><span></span><span></span>
                    </div>
                </button>
                <button class="sound-card" onclick="soundPlay(4)" data-sound="4">
                    <div class="sound-emoji"><i class="fa-solid fa-wind"></i></div>
                    <div class="sound-name">사운드 4</div>
                    <div class="sound-wave">
                        <span></span><span></span><span></span><span></span><span></span>
                    </div>
                </button>
                <button class="sound-card" onclick="soundPlay(5)" data-sound="5">
                    <div class="sound-emoji"><i class="fa-solid fa-bomb"></i></div>
                    <div class="sound-name">사운드 5</div>
                    <div class="sound-wave">
                        <span></span><span></span><span></span><span></span><span></span>
                    </div>
                </button>
            </div>

            <!-- Hidden audio elements -->
            <audio id="fart1"><source src="src/audio/wet-fart-6139.mp3" type="audio/mpeg"></audio>
            <audio id="fart2"><source src="src/audio/vegan-fart-voice-003-11981.mp3" type="audio/mpeg"></audio>
            <audio id="fart3"><source src="src/audio/fart-83471.mp3" type="audio/mpeg"></audio>
            <audio id="fart4"><source src="src/audio/vegan-fart-voice-014-11829.mp3" type="audio/mpeg"></audio>
            <audio id="fart5"><source src="src/audio/fart-sound-effect-16-11093.mp3" type="audio/mpeg"></audio>
        </section>

        <!-- Health Check Tab -->
        <section class="tab-content" id="tab-health">
            <div class="health-card">
                <div class="health-icon"><i class="fa-solid fa-chart-line"></i></div>
                <h2>방귀 분석기</h2>
                <p class="health-desc">방귀 소리를 업로드하면 분석해드립니다</p>
                <form id="fart-form">
                    <input type="file" accept="audio/*" id="audio-input" required>
                    <label for="audio-input" class="upload-btn">
                        <i class="fa-solid fa-folder-open"></i>
                        오디오 파일 선택
                    </label>
                </form>
                <div id="result"></div>
            </div>
        </section>

        <!-- Game Tab -->
        <section class="tab-content" id="tab-game">
            <div class="game-card">
                <div class="game-preview">
                    <div class="game-preview-icon"><i class="fa-solid fa-poo"></i></div>
                    <h2>똥 피하기 게임</h2>
                    <p>하늘에서 떨어지는 똥을 피하세요!</p>
                    <a href="index2.html" class="game-start-btn">
                        <i class="fa-solid fa-play"></i> 게임 시작하기
                    </a>
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="app-footer">
            <span class="copyright">&copy; 2026 MangoSoft Labs</span>
        </footer>
    </div>
</body>
<script src="src/js/index.js"></script>
</html>
